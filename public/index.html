<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>ドット絵の森</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:#fff;
}

/* ===== ホーム ===== */
#home{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:10px;
}

/* ===== メイン ===== */
#app{
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* ===== canvas ===== */
canvas{
  border:1px solid #ddd;
  touch-action:none;
}

/* ===== UI ===== */
#topbar{
  position:fixed;
  top:10px;
  left:10px;
  display:flex;
  gap:8px;
}

/* ===== 名前 ===== */
#nameTag{
  position:fixed;
  top:10px;
  right:10px;
  background:#fff;
  border:1px solid #ccc;
  padding:4px 8px;
}

/* ===== チャット ===== */
#chat{
  position:fixed;
  right:10px;
  bottom:10px;
  width:260px;
  height:240px;
  border:1px solid #ccc;
  display:none;
  flex-direction:column;
  background:#fff;
}

#msgs{
  flex:1;
  overflow:auto;
  font-size:13px;
  padding:5px;
}

#input{
  padding:8px;
  border:none;
  border-top:1px solid #ccc;
}
</style>
</head>

<body>

<!-- ===== HOME ===== -->
<div id="home">
  <h2>🌳 ドット絵の森</h2>

  <input id="name" placeholder="名前">

  <select id="size">
    <option>8</option>
    <option>16</option>
    <option selected>32</option>
    <option>64</option>
    <option>128</option>
    <option>256</option>
    <option>512</option>
  </select>

  <button onclick="create()">作成</button>
  <input id="joinId" placeholder="部屋ID">
  <button onclick="join()">入室</button>
</div>

<!-- ===== APP ===== -->
<div id="app">

<div id="topbar">
  <button onclick="toggleChat()">💬</button>
</div>

<div id="nameTag"></div>

<canvas id="c"></canvas>

<div id="chat">
  <div id="msgs"></div>
  <input id="input" placeholder="chat">
</div>

<!-- ibis風カラー -->
<canvas id="wheel" width="180" height="180"></canvas>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
let socket;
let board=[];
let size=32;
let selected="#000";

let undo=[],redo=[];

/* ===== room ===== */
function create(){
  const id=Math.random().toString(36).slice(2,8);
  const name=document.getElementById("name").value||"名無し";
  const s=document.getElementById("size").value;

  location.href=`?room=${id}&size=${s}&name=${name}`;
}

function join(){
  const id=document.getElementById("joinId").value;
  location.href=`?room=${id}`;
}

/* ===== init ===== */
const p=new URLSearchParams(location.search);
const room=p.get("room");
const name=p.get("name");

window.onload=()=>{

if(!room){
  document.getElementById("home").style.display="flex";
  return;
}

document.getElementById("home").style.display="none";
document.getElementById("app").style.display="flex";

socket=io({query:{room,name}});

document.getElementById("nameTag").textContent=name||"名無し";

const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=512;
c.height=512;

/* ===== init ===== */
socket.on("init",d=>{
  board=d.board;
  size=d.size;
  draw();
});

/* ===== draw ===== */
function draw(){
  const cell=512/size;

  ctx.clearRect(0,0,512,512);

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

      ctx.fillStyle=board[y][x];

      ctx.fillRect(x*cell,y*cell,cell,cell);
      ctx.strokeStyle="#eee";
      ctx.strokeRect(x*cell,y*cell,cell,cell);
    }
  }
}

/* ===== draw sync ===== */
socket.on("draw",d=>{
  board[d.y][d.x]=d.color;
  draw();
});

/* ===== click ===== */
c.onclick=(e)=>{

const cell=512/size;

const x=Math.floor(e.offsetX/cell);
const y=Math.floor(e.offsetY/cell);

socket.emit("draw",{x,y,color:selected});
};

/* ===== chat ===== */
function toggleChat(){
  const c=document.getElementById("chat");
  c.style.display=c.style.display==="flex"?"none":"flex";
}

document.getElementById("input").onkeydown=e=>{
  if(e.key==="Enter"){
    socket.emit("chat",{message:e.target.value});
    e.target.value="";
  }
};

socket.on("chat",d=>{
  const div=document.createElement("div");
  div.textContent=`${d.user}: ${d.message}`;
  document.getElementById("msgs").appendChild(div);
});

};
</script>

</body>
</html>
