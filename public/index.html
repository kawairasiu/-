<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ドット絵の森</title>

<style>
:root {
  --panel-bg: rgba(255,255,255,0.92);
  --line: #d7d7d7;
  --shadow: 0 12px 30px rgba(0,0,0,0.12);
}

body {
  margin: 0;
  font-family: sans-serif;
  overflow: hidden;
  background: #f7faf9;
}

/* ===== HOME ===== */
#home {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#fff8e7,#e7f6ff,#eafff2);
}

.homeCard {
  width: min(90vw, 380px);
  padding: 24px;
  border-radius: 20px;
  background: white;
  box-shadow: var(--shadow);
}

/* ===== APP ===== */
#app { display:none; }

button,input,select{
  font-size:16px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--line);
}

/* ===== TOOLBAR ===== */
#toolbar {
  position: fixed;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 6px;
  z-index: 1000;
}

#selectedDock {
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  background: var(--panel-bg);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow: var(--shadow);
}

#swatch {
  width:22px;height:22px;
  border-radius:6px;
  border:1px solid #999;
}

/* ===== USER ===== */
#userCount {
  position: fixed;
  top:10px;
  right:10px;
  background:white;
  padding:6px 10px;
  border-radius:10px;
  border:1px solid var(--line);
}

/* ===== PICKER ===== */
#pickerPanel {
  position: fixed;
  top:60px;
  left:10px;
  width:220px;
  display:none;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}

#pickerPanel.show { display:flex; }

canvas {
  border-radius:50%;
  border:2px solid #ccc;
  background:white;
}

.panel {
  background: var(--panel-bg);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  box-shadow: var(--shadow);
}

.slider {
  width:100%;
}

/* ===== CANVAS ===== */
#stage {
  position:fixed;
  left:50%;
  top:55%;
  transform:translate(-50%,-50%);
}

#canvas {
  background:white;
  border:1px solid #ccc;
}

/* ===== CHAT ===== */
#chatBox {
  position: fixed;
  right:10px;
  bottom:10px;
  width:260px;
  height:260px;
  display:flex;
  flex-direction:column;
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow: var(--shadow);
  overflow:hidden;
}

#chatHeader {
  padding:6px;
  background:#f1f5f9;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#messages {
  flex:1;
  overflow:auto;
  font-size:13px;
  padding:6px;
}

#chatInput {
  border:none;
  border-top:1px solid #ddd;
  padding:8px;
}

.hidden { display:none !important; }
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <div class="homeCard">
    <h2>🌳 ドット絵の森</h2>
    <button id="enter">入る</button>
  </div>
</div>

<!-- APP -->
<div id="app">

<!-- TOOLBAR -->
<div id="toolbar">
  <button id="pickerBtn">🎨</button>
  <button id="chatToggle">💬</button>
  <div id="selectedDock">
    <div id="swatch"></div>
    <span id="hex">#000000</span>
  </div>
</div>

<div id="userCount">👥 0</div>

<!-- PICKER -->
<div id="pickerPanel">

<canvas id="wheel" width="180" height="180"></canvas>

<div class="panel">
  <div>明度</div>
  <input id="light" class="slider" type="range" min="0" max="100" value="50">
</div>

<div class="panel">
  <div>彩度</div>
  <input id="sat" class="slider" type="range" min="0" max="100" value="100">
</div>

</div>

<!-- CANVAS -->
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<!-- CHAT -->
<div id="chatBox">
  <div id="chatHeader">
    <span>チャット</span>
    <button id="closeChat">×</button>
  </div>
  <div id="messages"></div>
  <input id="chatInput" placeholder="送信..." />
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io();

let color = "#000000";
let hue = 0, sat = 100, light = 50;

/* ===== UI ===== */
const picker = document.getElementById("pickerPanel");
document.getElementById("pickerBtn").onclick = () => {
  picker.classList.toggle("show");
};

/* chat open/close */
const chat = document.getElementById("chatBox");
document.getElementById("chatToggle").onclick = () => {
  chat.classList.toggle("hidden");
};
document.getElementById("closeChat").onclick = () => {
  chat.classList.add("hidden");
};

/* ===== COLOR UPDATE ===== */
function updateColor(){
  color = `hsl(${hue},${sat}%,${light}%)`;
  document.getElementById("swatch").style.background = color;
  document.getElementById("hex").textContent = color;
}

/* sliders */
document.getElementById("light").oninput = e=>{
  light = e.target.value;
  updateColor();
};

document.getElementById("sat").oninput = e=>{
  sat = e.target.value;
  updateColor();
};

/* ===== WHEEL (simple hue) ===== */
const wheel = document.getElementById("wheel");
const wctx = wheel.getContext("2d");

function drawWheel(){
  for(let i=0;i<360;i++){
    wctx.fillStyle = `hsl(${i},100%,50%)`;
    wctx.fillRect(i,0,1,180);
  }
}
drawWheel();

wheel.onclick = e=>{
  const x = e.offsetX;
  hue = x * 2;
  updateColor();
};

/* ===== CHAT ===== */
document.getElementById("chatInput").onkeydown = e=>{
  if(e.key==="Enter"){
    socket.emit("chat",{msg:e.target.value,color});
    e.target.value="";
  }
};

socket.on("chat",d=>{
  const div = document.createElement("div");
  div.textContent = d.msg;
  div.style.color = d.color;
  document.getElementById("messages").appendChild(div);
});

/* ===== ENTER ===== */
document.getElementById("enter").onclick = ()=>{
  document.getElementById("home").style.display="none";
  document.getElementById("app").style.display="block";
  updateColor();
};

</script>
</body>
</html>
