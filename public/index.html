<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: sans-serif;
}

/* ===== ホーム画面 ===== */
#home {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

/* ===== アプリ本体 ===== */
#app {
  display: none;
}

/* ===== キャンバス ===== */
canvas {
  display: block;
  margin: auto;
  background: white;
  border: 1px solid #ccc;
}

/* ===== パレット ===== */
#palette {
  position: fixed;
  top: 10px;
  left: 10px;
  display: flex;
  flex-wrap: wrap;
  width: 320px;
  gap: 2px;
  background: rgba(255,255,255,0.95);
  padding: 8px;
  border: 1px solid #ddd;
}

.color {
  width: 12px;
  height: 12px;
  cursor: pointer;
  border: 1px solid #aaa;
}

.selected {
  border: 2px solid black;
}
</style>
</head>

<body>

<!-- =========================
     ホーム画面
========================= -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <button id="createRoom">部屋を作る</button>

  <input id="roomInput" placeholder="部屋ID" />
  <button id="joinRoom">参加</button>
</div>

<!-- =========================
     アプリ本体
========================= -->
<div id="app">
  <div id="palette"></div>
  <canvas id="canvas"></canvas>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
/* =========================
   ルーム取得（安全版）
========================= */
const room = new URLSearchParams(location.search).get("room");

/* =========================
   画面切り替え（重要修正）
========================= */
window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
    document.getElementById("app").style.display = "none";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "block";
    initApp();
  }
};

/* =========================
   部屋作成
========================= */
document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).substring(2, 8);
  location.href = "?room=" + id;
};

/* =========================
   参加
========================= */
document.getElementById("joinRoom").onclick = () => {
  const id = document.getElementById("roomInput").value;
  if (id) location.href = "?room=" + id;
};

/* =========================
   メイン初期化
========================= */
function initApp() {

  /* socket */
  const socket = io({
    query: { room: room || "default" }
  });

  /* canvas */
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const size = 32;
  const pixel = 20;

  canvas.width = size * pixel;
  canvas.height = size * pixel;

  let board = [];

  /* ===== パレット ===== */
  const palette = document.getElementById("palette");
  let selected = "#000000";

  const colors = [
    "#000000","#ffffff","#ff0000","#00ff00","#0000ff",
    "#ffff00","#00ffff","#ff00ff","#888888","#ffa500"
  ];

  colors.forEach(c => {
    const d = document.createElement("div");
    d.className = "color";
    d.style.background = c;

    d.onclick = () => {
      selected = c;
      document.querySelectorAll(".color").forEach(el => el.classList.remove("selected"));
      d.classList.add("selected");
    };

    palette.appendChild(d);
  });

  /* ===== 描画 ===== */
  function draw() {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        ctx.fillStyle = board[y][x];
        ctx.fillRect(x * pixel, y * pixel, pixel, pixel);
      }
    }
  }

  /* ===== 初期データ ===== */
  socket.on("init", (data) => {
    board = data;
    draw();
  });

  /* ===== 更新 ===== */
  socket.on("draw", (d) => {
    if (!board[d.y]) return;
    board[d.y][d.x] = d.color;
    draw();
  });

  /* ===== クリック描画 ===== */
  canvas.onclick = (e) => {
    const x = Math.floor(e.offsetX / pixel);
    const y = Math.floor(e.offsetY / pixel);

    socket.emit("draw", {
      x,
      y,
      color: selected
    });
  };
}
</script>

</body>
</html>
