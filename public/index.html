<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: sans-serif;
}

/* ===== ホーム ===== */
#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

/* ===== アプリ ===== */
#app {
  display: none;
}

/* ===== キャンバス ===== */
canvas {
  display: block;
  margin: auto;
  border: 1px solid #ccc;
  touch-action: none;
}

/* ===== パレット ===== */
#palette {
  position: fixed;
  top: 10px;
  left: 10px;
  width: 90vw;
  max-width: 360px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
  background: rgba(255,255,255,0.95);
}

.color {
  width: 20px;
  height: 20px;
  border: 1px solid #aaa;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 260px;
  height: 240px;
  display: flex;
  flex-direction: column;
  border: 1px solid #ccc;
  background: white;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 5px;
}

#chatInput {
  font-size: 16px;
  padding: 8px;
  border: none;
  border-top: 1px solid #ccc;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <p id="userCount">👥 0人オンライン</p>

  <input id="sizeInput" type="number" min="8" max="512" value="32">

  <button id="createRoom">🌱 部屋を作る</button>

  <input id="roomInput" placeholder="部屋ID" />
  <button id="joinRoom">🌿 入る</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">
  <div id="palette"></div>
  <canvas id="canvas"></canvas>

  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput" placeholder="メッセージ" />
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const params = new URLSearchParams(location.search);
const room = params.get("room");
const sizeParam = params.get("size") || 32;

window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "block";
    init();
  }
};

/* ===== ルーム作成 ===== */
document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).substring(2, 8);
  let size = Number(document.getElementById("sizeInput").value);
  size = Math.max(8, Math.min(size, 512));

  location.href = `?room=${id}&size=${size}`;
};

/* ===== ルーム参加 ===== */
document.getElementById("joinRoom").onclick = () => {
  const id = document.getElementById("roomInput").value;
  if (id) location.href = "?room=" + id;
};

function init() {
  const socket = io({
    query: { room, size: sizeParam }
  });

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const pixel = 20;
  let board = [];
  let selected = "#000000";

  let scale = 1;

  /* ===== パレット ===== */
  const palette = document.getElementById("palette");

  const colors = (() => {
    const c = [];
    [0,51,102,153,204,255].forEach(r =>
      [0,51,102,153,204,255].forEach(g =>
        [0,51,102,153,204,255].forEach(b =>
          c.push(`rgb(${r},${g},${b})`)
        )
      )
    );
    return c;
  })();

  colors.forEach(c => {
    const d = document.createElement("div");
    d.className = "color";
    d.style.background = c;
    d.onclick = () => selected = c;
    palette.appendChild(d);
  });

  /* ===== 描画 ===== */
  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    for (let y = 0; y < board.length; y++) {
      for (let x = 0; x < board.length; x++) {
        ctx.fillStyle = board[y][x];
        ctx.fillRect(x*pixel, y*pixel, pixel, pixel);
        ctx.strokeStyle = "#eee";
        ctx.strokeRect(x*pixel, y*pixel, pixel, pixel);
      }
    }
  }

  socket.on("init", data => {
    board = data.board;

    const size = data.size;
    canvas.width = size * pixel;
    canvas.height = size * pixel;

    draw();
  });

  socket.on("draw", d => {
    board[d.y][d.x] = d.color;
    draw();
  });

  canvas.onclick = e => {
    const x = Math.floor(e.offsetX / pixel / scale);
    const y = Math.floor(e.offsetY / pixel / scale);

    socket.emit("draw", { x, y, color: selected });
  };

  /* ===== 人数 ===== */
  socket.on("users", c => {
    document.getElementById("userCount").innerText =
      `👥 ${c}人オンライン`;
  });

  /* ===== チャット ===== */
  document.getElementById("chatInput").onkeydown = e => {
    if (e.key === "Enter") {
      socket.emit("chat", {
        user: "名無し",
        message: e.target.value
      });
      e.target.value = "";
    }
  };

  socket.on("chat", d => {
    const div = document.createElement("div");
    div.textContent =
      d.user === "system" ? d.message : `${d.user}: ${d.message}`;
    document.getElementById("messages").appendChild(div);
  });
}
</script>

</body>
</html>
