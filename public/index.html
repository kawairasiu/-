<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: sans-serif;
  overflow: hidden;
}

/* ===== ホーム ===== */
#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

/* ===== アプリ ===== */
#app {
  display: none;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* ===== canvas ===== */
canvas {
  border: 1px solid #ccc;
  touch-action: none;
  transform-origin: center;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 260px;
  height: 240px;
  display: none;
  flex-direction: column;
  background: white;
  border: 1px solid #ccc;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 5px;
}

#chatInput {
  padding: 8px;
  font-size: 14px;
  border: none;
  border-top: 1px solid #ccc;
}

#nameLabel {
  position: fixed;
  top: 10px;
  left: 10px;
  background: rgba(255,255,255,0.8);
  padding: 4px 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <input id="nameInput" placeholder="名前" />

  <select id="sizeSelect">
    <option>8</option>
    <option>16</option>
    <option selected>32</option>
    <option>64</option>
    <option>128</option>
    <option>256</option>
    <option>512</option>
  </select>

  <button id="createRoom">作成</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">

  <div id="nameLabel"></div>

  <button id="chatToggle">💬</button>

  <canvas id="canvas"></canvas>

  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput" placeholder="メッセージ" />
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const params = new URLSearchParams(location.search);
const room = params.get("room");
const name = params.get("name");

let socket;

window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "flex";
    init();
  }
};

document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).slice(2,7);
  const size = document.getElementById("sizeSelect").value;
  const name = document.getElementById("nameInput").value || "名無し";

  location.href = `?room=${id}&size=${size}&name=${name}`;
};

function init() {

socket = io({
  query: {
    room,
    size: 32,
    name: name || "名無し"
  }
});

document.getElementById("nameLabel").textContent = "👤 " + (name || "名無し");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = 512;
canvas.height = 512;

let GRID_SIZE = 32;
let board = [];
let selected = "#000";

let undo = [];
let redo = [];

let scale = 1;
let lastDist = null;

/* ===== init ===== */
socket.on("init", (data) => {
  board = data.board;
  GRID_SIZE = data.size;
  draw();
});

/* ===== draw ===== */
function draw() {
  const size = canvas.width / GRID_SIZE;

  ctx.clearRect(0,0,512,512);

  for(let y=0;y<GRID_SIZE;y++){
    for(let x=0;x<GRID_SIZE;x++){
      ctx.fillStyle = board[y][x];
      ctx.fillRect(x*size,y*size,size,size);
      ctx.strokeStyle="#eee";
      ctx.strokeRect(x*size,y*size,size,size);
    }
  }
}

/* ===== undo ===== */
function push(){
  undo.push(JSON.stringify(board));
  redo = [];
}

/* ===== draw sync ===== */
socket.on("draw",(d)=>{
  board[d.y][d.x]=d.color;
  draw();
});

/* ===== click ===== */
canvas.onclick=(e)=>{
  push();

  const rect=canvas.getBoundingClientRect();
  const size=canvas.width/GRID_SIZE;

  const x=Math.floor((e.clientX-rect.left)/size);
  const y=Math.floor((e.clientY-rect.top)/size);

  socket.emit("draw",{x,y,color:selected});
};

/* ===== chat ===== */
document.getElementById("chatToggle").onclick=()=>{
  const box=document.getElementById("chatBox");
  box.style.display = box.style.display==="flex" ? "none" : "flex";
};

document.getElementById("chatInput").onkeydown=(e)=>{
  if(e.key==="Enter"){
    socket.emit("chat",{message:e.target.value});
    e.target.value="";
  }
};

socket.on("chat",(d)=>{
  const div=document.createElement("div");
  div.textContent=`${d.user}: ${d.message}`;
  document.getElementById("messages").appendChild(div);
});

}
</script>

</body>
</html>
