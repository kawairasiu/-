<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: sans-serif;
}

#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

#app {
  display: none;
}

/* ===== キャンバス ===== */
canvas {
  display: block;
  margin: auto;
  border: 1px solid #ccc;
  touch-action: none;
}

/* ===== カラーホイール ===== */
#colorWheel {
  position: fixed;
  top: 10px;
  left: 10px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 1px solid #ccc;
  display: none;
  background: white;
  z-index: 1000;
}

#colorWheel.show {
  display: block;
}

/* ===== 最近色 ===== */
#recent {
  position: fixed;
  top: 180px;
  left: 10px;
  display: flex;
  gap: 4px;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 260px;
  height: 240px;
  display: flex;
  flex-direction: column;
  border: 1px solid #ccc;
  background: white;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 5px;
}

#chatInput {
  font-size: 16px;
  padding: 8px;
  border: none;
  border-top: 1px solid #ccc;
}

button {
  margin: 4px;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <select id="sizeSelect">
    <option value="8">8</option>
    <option value="16">16</option>
    <option value="32" selected>32</option>
    <option value="64">64</option>
    <option value="128">128</option>
    <option value="256">256</option>
    <option value="512">512</option>
  </select>

  <button id="createRoom">🌱 部屋作成</button>

  <input id="roomInput" placeholder="部屋ID" />
  <button id="joinRoom">🌿 入室</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">

  <button id="togglePicker">🎨</button>
  <button id="eyeBtn">🧲</button>
  <button id="saveBtn">💾 PNG</button>

  <canvas id="colorWheel" width="160" height="160"></canvas>

  <div id="recent"></div>

  <canvas id="canvas"></canvas>

  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput" placeholder="メッセージ" />
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const params = new URLSearchParams(location.search);
const room = params.get("room");

window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "block";
    init();
  }
};

/* ===== ルーム ===== */
document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).substring(2,7);
  const size = document.getElementById("sizeSelect").value;
  location.href = `?room=${id}&size=${size}`;
};

document.getElementById("joinRoom").onclick = () => {
  const id = document.getElementById("roomInput").value;
  if (id) location.href = `?room=${id}`;
};

function init() {
  const socket = io({ query: { room } });

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const GRID_SIZE = 32;
  const CANVAS_SIZE = 512;
  const cellSize = CANVAS_SIZE / GRID_SIZE;

  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  let board = [];
  let selected = "#000";
  let eyeDropper = false;
  let recent = [];
  let selectedHue = 0;

  /* ===== カラーホイール ===== */
  const wheel = document.getElementById("colorWheel");
  const wctx = wheel.getContext("2d");

  const c = 80;

  function drawWheel() {
    for (let a=0;a<360;a++){
      const rad=(a*Math.PI)/180;

      for(let r=0;r<80;r++){
        const x=c+Math.cos(rad)*r;
        const y=c+Math.sin(rad)*r;

        wctx.fillStyle=`hsl(${a},${(r/80)*100}%,50%)`;
        wctx.fillRect(x,y,2,2);
      }
    }
  }

  drawWheel();

  /* ===== 開閉 ===== */
  document.getElementById("togglePicker").onclick = () => {
    wheel.classList.toggle("show");
  };

  /* ===== スポイト ===== */
  document.getElementById("eyeBtn").onclick = () => {
    eyeDropper = !eyeDropper;
  };

  /* ===== 最近色 ===== */
  function addRecent(color){
    recent.unshift(color);
    recent=[...new Set(recent)].slice(0,4);

    const div=document.getElementById("recent");
    div.innerHTML="";

    recent.forEach(c=>{
      const box=document.createElement("div");
      box.style.width="20px";
      box.style.height="20px";
      box.style.background=c;
      box.onclick=()=>selected=c;
      div.appendChild(box);
    });
  }

  /* ===== PNG保存 ===== */
  document.getElementById("saveBtn").onclick=()=>{
    const a=document.createElement("a");
    a.download=`dot-${Date.now()}.png`;
    a.href=canvas.toDataURL();
    a.click();
  };

  /* ===== 描画 ===== */
  function draw(){
    ctx.clearRect(0,0,512,512);

    for(let y=0;y<GRID_SIZE;y++){
      for(let x=0;x<GRID_SIZE;x++){
        ctx.fillStyle=board[y][x];

        ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize);
        ctx.strokeStyle="#eee";
        ctx.strokeRect(x*cellSize,y*cellSize,cellSize,cellSize);
      }
    }
  }

  socket.on("init",d=>{
    board=d.board;
    draw();
  });

  socket.on("draw",d=>{
    board[d.y][d.x]=d.color;
    draw();
  });

  /* ===== クリック ===== */
  canvas.onclick=(e)=>{
    const rect=canvas.getBoundingClientRect();

    const x=Math.floor((e.clientX-rect.left)/cellSize);
    const y=Math.floor((e.clientY-rect.top)/cellSize);

    if(eyeDropper){
      selected=board[y][x];
      addRecent(selected);
      eyeDropper=false;
      return;
    }

    socket.emit("draw",{x,y,color:selected});
    addRecent(selected);
  };

  /* ===== チャット ===== */
  document.getElementById("chatInput").onkeydown=e=>{
    if(e.key==="Enter"){
      socket.emit("chat",{user:"名無し",message:e.target.value});
      e.target.value="";
    }
  };

  socket.on("chat",d=>{
    const div=document.createElement("div");
    div.textContent=d.user==="system"?d.message:`${d.user}: ${d.message}`;
    document.getElementById("messages").appendChild(div);
  });
}
</script>

</body>
</html>
