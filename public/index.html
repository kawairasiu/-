<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: sans-serif;
}

/* ===== ホーム ===== */
#home {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

#app {
  display: none;
}

/* ===== キャンバス ===== */
canvas {
  display: block;
  margin: auto;
  background: white;
  border: 1px solid #ccc;
}

/* ===== パレット ===== */
#palette {
  position: fixed;
  top: 10px;
  left: 10px;
  display: flex;
  flex-wrap: wrap;
  width: 320px;
  gap: 2px;
  background: rgba(255,255,255,0.95);
  padding: 8px;
  border: 1px solid #ddd;
}

.color {
  width: 12px;
  height: 12px;
  border: 1px solid #aaa;
  cursor: pointer;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 220px;
  height: 200px;
  background: white;
  border: 1px solid #ccc;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 12px;
  padding: 5px;
}

#chatInput {
  border: none;
  border-top: 1px solid #ccc;
  padding: 5px;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <p id="userCount">👥 0人オンライン</p>

  <button id="createRoom">🌱 部屋を作る</button>

  <input id="roomInput" placeholder="部屋ID" />
  <button id="joinRoom">🌿 入る</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">
  <div id="palette"></div>
  <canvas id="canvas"></canvas>

  <!-- チャット -->
  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput" placeholder="メッセージ" />
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const room = new URLSearchParams(location.search).get("room");

window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
    document.getElementById("app").style.display = "none";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "block";
    init();
  }
};

/* ===== ルーム作成 ===== */
document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).substring(2, 8);
  location.href = "?room=" + id;
};

document.getElementById("joinRoom").onclick = () => {
  const id = document.getElementById("roomInput").value;
  if (id) location.href = "?room=" + id;
};

function init() {
  const socket = io({ query: { room } });

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const size = 32;
  const pixel = 20;

  canvas.width = size * pixel;
  canvas.height = size * pixel;

  let board = [];
  let selected = "#000000";

  /* ===== パレット（256簡易） ===== */
  const palette = document.getElementById("palette");

  const colors = ["#000","#fff","#f00","#0f0","#00f","#ff0","#0ff","#f0f","#888","#ffa500"];

  colors.forEach(c => {
    const d = document.createElement("div");
    d.className = "color";
    d.style.background = c;
    d.onclick = () => selected = c;
    palette.appendChild(d);
  });

  function draw() {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        ctx.fillStyle = board[y][x];
        ctx.fillRect(x*pixel, y*pixel, pixel, pixel);
        ctx.strokeStyle = "#e0e0e0";
        ctx.strokeRect(x*pixel, y*pixel, pixel, pixel);
      }
    }
  }

  socket.on("init", (data) => {
    board = data;
    draw();
  });

  socket.on("draw", (d) => {
    board[d.y][d.x] = d.color;
    draw();
  });

  canvas.onclick = (e) => {
    const x = Math.floor(e.offsetX / pixel);
    const y = Math.floor(e.offsetY / pixel);

    socket.emit("draw", { x, y, color: selected });
  };

  /* ===== 人数 ===== */
  socket.on("users", (count) => {
    document.getElementById("userCount").innerText =
      `👥 ${count}人オンライン`;
  });

  /* ===== チャット ===== */
  document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      socket.emit("chat", {
        user: "名無し",
        message: e.target.value
      });
      e.target.value = "";
    }
  });

  socket.on("chat", (data) => {
    const div = document.createElement("div");

    if (data.user === "system") {
      div.style.color = "#888";
      div.style.fontStyle = "italic";
      div.textContent = data.message;
    } else {
      div.textContent = `${data.user}: ${data.message}`;
    }

    document.getElementById("messages").appendChild(div);
  });
}
</script>

</body>
</html>
