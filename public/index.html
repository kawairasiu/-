<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: #fff;
}

/* ===== ホーム ===== */
#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

/* ===== アプリ ===== */
#app {
  display: none;
}

/* ===== ツールバー ===== */
#toolbar {
  position: fixed;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 6px;
  z-index: 1000;
}

/* ===== 人数 ===== */
#userCount {
  position: fixed;
  top: 10px;
  right: 10px;
  background: #fff;
  border: 1px solid #ccc;
  padding: 6px 10px;
  font-size: 14px;
  z-index: 1000;
}

/* ===== キャンバス ===== */
canvas {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #ccc;
  touch-action: none;
}

/* ===== カラーホイール ===== */
#colorWheel {
  position: fixed;
  top: 70px;
  left: 10px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  display: none;
  background: white;
  border: 1px solid #ccc;
  z-index: 1001;
}

#colorWheel.show {
  display: block;
}

/* ===== 最近色 ===== */
#recent {
  position: fixed;
  top: 260px;
  left: 10px;
  display: flex;
  gap: 4px;
  z-index: 1001;
}

.recentColor {
  width: 20px;
  height: 20px;
  border: 1px solid #aaa;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 260px;
  height: 240px;
  display: flex;
  flex-direction: column;
  border: 1px solid #ccc;
  background: white;
  z-index: 1000;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 6px;
}

#chatInput {
  padding: 8px;
  font-size: 16px;
  border: none;
  border-top: 1px solid #ccc;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <select id="sizeSelect">
    <option>8</option>
    <option>16</option>
    <option selected>32</option>
    <option>64</option>
    <option>128</option>
    <option>256</option>
    <option>512</option>
  </select>

  <button id="create">作成</button>
  <input id="room" placeholder="部屋ID" />
  <button id="join">入室</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">

  <div id="toolbar">
    <button id="pickerBtn">🎨</button>
    <button id="eyeBtn">🧲</button>
    <button id="undoBtn">↩</button>
    <button id="redoBtn">↪</button>
  </div>

  <div id="userCount">👥 0</div>

  <canvas id="colorWheel" width="180" height="180"></canvas>
  <div id="recent"></div>

  <canvas id="canvas"></canvas>

  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput" placeholder="チャット" />
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const p = new URLSearchParams(location.search);
const room = p.get("room");
const sizeParam = Number(p.get("size") || 32);

if (room) {
  document.getElementById("home").style.display = "none";
  document.getElementById("app").style.display = "block";
  init();
}

document.getElementById("create").onclick = () => {
  const id = Math.random().toString(36).slice(2,7);
  const size = document.getElementById("sizeSelect").value;
  location.href = `?room=${id}&size=${size}`;
};

document.getElementById("join").onclick = () => {
  const id = document.getElementById("room").value;
  location.href = `?room=${id}`;
};

function init() {
  const socket = io({ query: { room, size: sizeParam } });

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const BASE_SIZE = 512;

  let GRID_SIZE = 32;
  let CELL_SIZE;

  canvas.width = BASE_SIZE;
  canvas.height = BASE_SIZE;

  let board = [];

  let selected = "#000";
  let eye = false;

  let undo = [];
  let redo = [];

  let scale = 1;
  let panX = 0, panY = 0;

  function applyTransform(){
    canvas.style.transform =
      `translate(${panX}px,${panY}px) scale(${scale})`;
  }

  function cellSize(){
    return BASE_SIZE / GRID_SIZE;
  }

  function draw(){
    ctx.clearRect(0,0,BASE_SIZE,BASE_SIZE);

    const s = cellSize();

    for(let y=0;y<GRID_SIZE;y++){
      for(let x=0;x<GRID_SIZE;x++){
        ctx.fillStyle = board[y][x];
        ctx.fillRect(x*s,y*s,s,s);
        ctx.strokeStyle="#eee";
        ctx.strokeRect(x*s,y*s,s,s);
      }
    }
  }

  function pushUndo(){
    undo.push(JSON.stringify(board));
    redo=[];
  }

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const s = cellSize();
    return {
      x: Math.floor(((e.clientX-r.left)/r.width)*BASE_SIZE/s),
      y: Math.floor(((e.clientY-r.top)/r.height)*BASE_SIZE/s)
    };
  }

  /* ===== init ===== */
  socket.on("init", d=>{
    board = d.board;
    GRID_SIZE = d.size;
    CELL_SIZE = cellSize();
    draw();
  });

  socket.on("draw", d=>{
    board[d.y][d.x]=d.color;
    draw();
  });

  /* ===== draw ===== */
  canvas.onclick = e=>{
    const {x,y}=getPos(e);

    pushUndo();

    board[y][x]=selected;
    socket.emit("draw",{x,y,color:selected});
    draw();
  };

  /* ===== undo redo ===== */
  document.getElementById("undoBtn").onclick=()=>{
    if(!undo.length) return;
    redo.push(JSON.stringify(board));
    board=JSON.parse(undo.pop());
    draw();
    socket.emit("setBoard",{board});
  };

  document.getElementById("redoBtn").onclick=()=>{
    if(!redo.length) return;
    undo.push(JSON.stringify(board));
    board=JSON.parse(redo.pop());
    draw();
    socket.emit("setBoard",{board});
  };

  /* ===== color wheel ===== */
  const wheel = document.getElementById("colorWheel");
  const wctx = wheel.getContext("2d");

  const cx=90,cy=90,r1=60,r2=85;

  let hue=0;
  let ix=cx,iy=cy;

  function drawWheel(){
    wctx.clearRect(0,0,180,180);

    for(let y=0;y<180;y++){
      for(let x=0;x<180;x++){
        const dx=x-cx,dy=y-cy;
        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<r1||d>r2) continue;

        const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
        wctx.fillStyle=`hsl(${h},100%,50%)`;
        wctx.fillRect(x,y,1,1);
      }
    }

    for(let y=-r1;y<r1;y++){
      for(let x=-r1;x<r1;x++){
        const d=Math.sqrt(x*x+y*y);
        if(d>r1) continue;

        const s=d/r1;
        const l=1-(y+r1)/(r1*2);

        wctx.fillStyle=`hsl(${hue},${s*100}%,${l*100}%)`;
        wctx.fillRect(cx+x,cy+y,1,1);
      }
    }

    wctx.beginPath();
    wctx.arc(ix,iy,4,0,Math.PI*2);
    wctx.stroke();
  }

  function handleWheel(e){
    const r=wheel.getBoundingClientRect();
    const x=e.clientX-r.left-cx;
    const y=e.clientY-r.top-cy;
    const d=Math.sqrt(x*x+y*y);

    if(d>r1&&d<r2){
      hue=(Math.atan2(y,x)*180/Math.PI+360)%360;
    }

    if(d<r1){
      ix=cx+x;
      iy=cy+y;
      selected=`hsl(${hue},${Math.min(1,d/r1)*100}%,50%)`;
    }

    drawWheel();
  }

  wheel.onpointerdown=e=>{
    wheel.setPointerCapture(e.pointerId);
    handleWheel(e);
    wheel.onpointermove=handleWheel;
    wheel.onpointerup=()=>wheel.onpointermove=null;
  };

  document.getElementById("pickerBtn").onclick=()=>{
    wheel.classList.toggle("show");
  };

  drawWheel();

  /* ===== pan + zoom ===== */
  let dragging=false;
  let last=null;

  canvas.oncontextmenu=e=>e.preventDefault();

  canvas.onmousedown=e=>{
    if(e.button===2){
      dragging=true;
      last={x:e.clientX,y:e.clientY};
    }
  };

  window.onmousemove=e=>{
    if(!dragging) return;
    panX+=e.clientX-last.x;
    panY+=e.clientY-last.y;
    last={x:e.clientX,y:e.clientY};
    applyTransform();
  };

  window.onmouseup=()=>dragging=false;

  /* ===== touch pan + pinch ===== */
  let startDist=0,startScale=1;

  canvas.ontouchstart=e=>{
    if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      startDist=Math.sqrt(dx*dx+dy*dy);
      startScale=scale;
    }
  };

  canvas.ontouchmove=e=>{
    if(e.touches.length===2){
      e.preventDefault();

      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.sqrt(dx*dx+dy*dy);

      scale=Math.min(3,Math.max(0.5,startScale*(d/startDist)));
      applyTransform();
    }
  };

  /* ===== chat ===== */
  document.getElementById("chatInput").onkeydown=e=>{
    if(e.key==="Enter"){
      socket.emit("chat",{message:e.target.value});
      e.target.value="";
    }
  };

  socket.on("chat",d=>{
    const div=document.createElement("div");
    div.textContent=d.message;
    document.getElementById("messages").appendChild(div);
  });

  socket.on("users",n=>{
    document.getElementById("userCount").innerText=`👥 ${n}`;
  });
}
</script>

</body>
</html>
