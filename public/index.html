<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ドット絵の森</title>

<style>
body {
  margin: 0;
  background: #fff;
  font-family: sans-serif;
  overflow: hidden;
}

#home {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

#app { display: none; }

/* ===== canvas ===== */
canvas {
  display: block;
  margin: auto;
  border: 1px solid #ccc;
  touch-action: none;
}

/* ===== カラーホイール ===== */
#colorWheel {
  position: fixed;
  top: 10px;
  left: 10px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 1px solid #ccc;
  display: none;
  background: white;
  z-index: 1000;
}

#colorWheel.show {
  display: block;
}

/* ===== 最近色 ===== */
#recent {
  position: fixed;
  top: 200px;
  left: 10px;
  display: flex;
  gap: 4px;
}

/* ===== チャット ===== */
#chatBox {
  position: fixed;
  right: 10px;
  bottom: 10px;
  width: 260px;
  height: 240px;
  display: flex;
  flex-direction: column;
  border: 1px solid #ccc;
  background: white;
}

#messages {
  flex: 1;
  overflow-y: auto;
  font-size: 13px;
  padding: 5px;
}

#chatInput {
  font-size: 16px;
  padding: 8px;
  border: none;
  border-top: 1px solid #ccc;
}

button {
  margin: 4px;
}
</style>
</head>

<body>

<!-- ===== ホーム ===== -->
<div id="home">
  <h1>🌳 ドット絵の森</h1>

  <select id="sizeSelect">
    <option>8</option>
    <option>16</option>
    <option selected>32</option>
    <option>64</option>
    <option>128</option>
    <option>256</option>
    <option>512</option>
  </select>

  <button id="createRoom">🌱 作成</button>

  <input id="roomInput" placeholder="部屋ID" />
  <button id="joinRoom">🌿 入室</button>
</div>

<!-- ===== 本体 ===== -->
<div id="app">

  <button id="togglePicker">🎨</button>
  <button id="eyeBtn">🧲</button>
  <button id="undoBtn">↩</button>
  <button id="redoBtn">↪</button>
  <button id="saveBtn">💾</button>

  <canvas id="colorWheel" width="180" height="180"></canvas>

  <div id="recent"></div>

  <canvas id="canvas"></canvas>

  <div id="chatBox">
    <div id="messages"></div>
    <input id="chatInput">
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const params = new URLSearchParams(location.search);
const room = params.get("room");

let socket;

window.onload = () => {
  if (!room) {
    document.getElementById("home").style.display = "flex";
  } else {
    document.getElementById("home").style.display = "none";
    document.getElementById("app").style.display = "block";
    init();
  }
};

document.getElementById("createRoom").onclick = () => {
  const id = Math.random().toString(36).slice(2,8);
  const size = document.getElementById("sizeSelect").value;
  location.href = `?room=${id}&size=${size}`;
};

document.getElementById("joinRoom").onclick = () => {
  const id = document.getElementById("roomInput").value;
  location.href = `?room=${id}`;
};

function init() {

socket = io({ query: { room } });

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

canvas.width = 512;
canvas.height = 512;

let board = [];
let GRID_SIZE = 32;
let CELL_SIZE = 16;

let selected = "#000";
let eye = false;

let undoStack = [];
let redoStack = [];

let scale = 1;
let lastDist = null;

/* ===== init ===== */
socket.on("init", (data) => {
  board = data.board;
  GRID_SIZE = data.size;
  CELL_SIZE = canvas.width / GRID_SIZE;
  draw();
});

/* ===== draw ===== */
function draw() {
  ctx.clearRect(0,0,512,512);

  for(let y=0;y<GRID_SIZE;y++){
    for(let x=0;x<GRID_SIZE;x++){
      ctx.fillStyle = board[y][x];
      ctx.fillRect(x*CELL_SIZE,y*CELL_SIZE,CELL_SIZE,CELL_SIZE);
      ctx.strokeStyle="#eee";
      ctx.strokeRect(x*CELL_SIZE,y*CELL_SIZE,CELL_SIZE,CELL_SIZE);
    }
  }
}

/* ===== undo/redo ===== */
function pushUndo(){
  undoStack.push(JSON.stringify(board));
  redoStack = [];
}

document.getElementById("undoBtn").onclick = () => {
  if(!undoStack.length) return;
  redoStack.push(JSON.stringify(board));
  board = JSON.parse(undoStack.pop());
  draw();
};

document.getElementById("redoBtn").onclick = () => {
  if(!redoStack.length) return;
  undoStack.push(JSON.stringify(board));
  board = JSON.parse(redoStack.pop());
  draw();
};

/* ===== draw ===== */
socket.on("draw",(d)=>{
  board[d.y][d.x]=d.color;
  draw();
});

/* ===== click ===== */
canvas.onclick=(e)=>{
  pushUndo();

  const rect=canvas.getBoundingClientRect();

  const x=Math.floor((e.clientX-rect.left)/CELL_SIZE);
  const y=Math.floor((e.clientY-rect.top)/CELL_SIZE);

  if(eye){
    selected=board[y][x];
    eye=false;
    return;
  }

  socket.emit("draw",{x,y,color:selected});
};

/* ===== pinch zoom ===== */
canvas.addEventListener("touchmove",(e)=>{
  if(e.touches.length!=2) return;

  const dx=e.touches[0].clientX-e.touches[1].clientX;
  const dy=e.touches[0].clientY-e.touches[1].clientY;

  const dist=Math.sqrt(dx*dx+dy*dy);

  if(lastDist){
    scale+= (dist-lastDist)*0.005;
    scale=Math.min(Math.max(scale,0.5),4);
    canvas.style.transform=`scale(${scale})`;
  }

  lastDist=dist;
});

canvas.addEventListener("touchend",()=>{
  lastDist=null;
});

/* ===== chat ===== */
document.getElementById("chatInput").onkeydown=(e)=>{
  if(e.key==="Enter"){
    socket.emit("chat",{message:e.target.value});
    e.target.value="";
  }
};

socket.on("chat",(d)=>{
  const div=document.createElement("div");
  div.textContent=d.user==="system"?d.message:`${d.user}: ${d.message}`;
  document.getElementById("messages").appendChild(div);
});

}
</script>

</body>
</html>
